# Alert rules of the detection stack (R-06). Each one turns a silent failure into a page:
# without them a stopped sensor or a stuck pipeline reads as "no attacks". Tested with
# promtool (monitoring/alerts.test.yml, make lint-ci); thresholds are in seconds.
groups:
  - name: ml-ids-stack
    rules:
      # Without the exporter every rule below goes quiet, so its own absence is an alert.
      - alert: ExporterDown
        expr: up{job="mlids-exporter"} == 0
        for: 1m
        labels: { severity: critical, risk: R-06 }
        annotations:
          summary: The stack exporter does not answer; the other alerts are blind.

      # The detector rewrites out/heartbeat.json every 10 s (detector/watch.py). A heartbeat
      # older than 60 s, or none at all, means the sensor is stopped or hung.
      - alert: SensorDown
        expr: (time() - mlids_detector_heartbeat_timestamp_seconds > 60) or absent(mlids_detector_heartbeat_timestamp_seconds)
        for: 30s
        labels: { severity: critical, risk: R-06 }
        annotations:
          summary: The ML-IDS detector has not beaten for over a minute; no flow is scored.

      # Logstash does not answer: nothing new reaches OpenSearch.
      - alert: PipelineStalled
        expr: logstash_up == 0
        for: 1m
        labels: { severity: critical, risk: R-06, reason: logstash-down }
        annotations:
          summary: Logstash does not answer; sensor output is not indexed.

      # Records the sensors wrote that OpenSearch does not hold, for 5 minutes. Logstash reads a
      # new file within seconds, so a gap that lasts means lost or stuck records.
      - alert: PipelineStalled
        expr: (mlids_out_records - on(pipeline) mlids_indexed_documents) > 0
        for: 5m
        labels: { severity: warning, risk: R-06, reason: records-not-indexed }
        annotations:
          summary: "{{ $labels.pipeline }}: {{ $value }} records in out/ are not in OpenSearch."

      # The MISP dictionary Logstash enriches with is over 12 h old, or there is none: matches
      # against new indicators are missed (R-10). make schedule pulls every 6 h.
      - alert: IocFeedStale
        expr: (time() - mlids_ioc_dictionary_timestamp_seconds > 12 * 3600) or absent(mlids_ioc_dictionary_timestamp_seconds)
        for: 10m
        labels: { severity: warning, risk: R-10 }
        annotations:
          summary: The MISP dictionary is over 12 hours old or missing; new indicators are not matched.

      # The weekly check of the lab's public address found a port that was closed the week before.
      - alert: ExposureChanged
        expr: mlids_exposure_ports_opened > 0
        labels: { severity: warning, risk: R-10 }
        annotations:
          summary: "{{ $value }} port(s) newly open on the lab's public address (exposure/changes.json)."

      # The weekly exposure check has not run for 8 days, or never: ExposureChanged would stay quiet.
      - alert: ExposureCheckStale
        expr: (time() - mlids_exposure_checked_timestamp_seconds > 8 * 86400) or absent(mlids_exposure_checked_timestamp_seconds)
        for: 10m
        labels: { severity: warning, risk: R-10 }
        annotations:
          summary: The exposure check of the lab's public address has not run for 8 days.

      # More alert episodes in the last hour than the analyst budget (R-08): one per hour, the
      # budget the threshold is calibrated against (make calibrate). A replay of attack fixtures
      # fires it too, as attacks also spend the analyst's attention. Counted against the lowest
      # value in the hour, not a sample exactly an hour back, which a restart or pause would lack.
      - alert: AlertBudgetExceeded
        expr: (mlids_episodes_written - min_over_time(mlids_episodes_written[1h])) > 1
        labels: { severity: warning, risk: R-08 }
        annotations:
          summary: "{{ $value }} alert episodes in the last hour, over the budget of 1 (docs/evidence/R-08-fp-budget.md)."

      - alert: OpenSearchDown
        expr: opensearch_up == 0 or opensearch_cluster_status == 2
        for: 1m
        labels: { severity: critical, risk: R-06 }
        annotations:
          summary: OpenSearch does not answer or its cluster is red; alerts cannot be searched.
