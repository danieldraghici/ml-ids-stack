# The only way into OpenSearch Dashboards and Grafana: HTTPS with the lab CA's certificate (R-02).

# Grafana Live keeps a WebSocket open; other requests close the connection as usual.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name localhost frontdoor.lab;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/frontdoor.crt;
    ssl_certificate_key /etc/nginx/certs/frontdoor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Grafana (R-06), served from the sub-path /grafana/ (GF_SERVER_SERVE_FROM_SUB_PATH).
    # Resolved through Docker's DNS on each request (valid 10 s), so a recreated Grafana with a new
    # address is found without restarting the front door. With a variable, nginx passes the
    # request URI unchanged, which the sub-path setup expects.
    location /grafana/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://opensearch-dashboards:5601;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
