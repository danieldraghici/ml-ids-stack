# Stack output (R-02, R-06): OpenSearch over TLS inside the compose network, with the admin
# password from the environment (decrypted by make secrets, never in a file in git).
# Certificate verification is off: OpenSearch serves its bundled demo certificate, whose CA key
# ships with the image, so checking it would prove nothing. The connection never leaves the
# compose network, and nothing outside it can reach Logstash (no published port).
# Logstash installs each index template before its first write. Indices: mlids-alert-*,
# mlids-episode-*, suricata-*; a record the filters reject goes to mlids-error-* or suricata-error-*.
output {
  if [@metadata][doc_id] and [@metadata][pipeline] == "mlids" {
    opensearch {
      hosts => ["https://opensearch:9200"]
      user => "admin"
      password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
      index => "%{[@metadata][index]}-%{+yyyy.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      manage_template => true
      template => "/usr/share/logstash/templates/mlids-template.json"
      template_name => "mlids"
      template_overwrite => true
    }
  } else if [@metadata][doc_id] and [@metadata][pipeline] == "suricata" {
    opensearch {
      hosts => ["https://opensearch:9200"]
      user => "admin"
      password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
      index => "%{[@metadata][index]}-%{+yyyy.MM.dd}"
      document_id => "%{[@metadata][doc_id]}"
      manage_template => true
      template => "/usr/share/logstash/templates/suricata-template.json"
      template_name => "suricata"
      template_overwrite => true
    }
  } else if [@metadata][pipeline] {
    opensearch {
      hosts => ["https://opensearch:9200"]
      user => "admin"
      password => "${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
      ssl => true
      ssl_certificate_verification => false
      index => "%{[@metadata][pipeline]}-error-%{+yyyy.MM.dd}"
      manage_template => false
    }
  }
}
