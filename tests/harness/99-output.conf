# Pipeline tests: every event goes to stdout as one JSON line, with the routing metadata
# copied into visible fields so the tests can check where it would be indexed.
filter {
  mutate {
    add_field => {
      "[test][index]" => "%{[@metadata][index]}"
      "[test][doc_id]" => "%{[@metadata][doc_id]}"
    }
  }
}
output { stdout { codec => json_lines } }
