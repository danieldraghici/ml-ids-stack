# Stack input (R-06): the detector's output folder, mounted read-only at /data.
# make replay writes <capture>.alerts.jsonl and <capture>.episodes.jsonl there; Logstash tails
# both. Document ids are fingerprints (mlids.conf), so re-reading a file after a restart
# overwrites the same documents instead of adding copies.
input {
  file {
    path => ["/data/*.alerts.jsonl", "/data/*.episodes.jsonl"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-mlids"
    mode => "tail"
    codec => plain
    add_field => { "[@metadata][pipeline]" => "mlids" }
  }
}
