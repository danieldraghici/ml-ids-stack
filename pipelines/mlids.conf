# ML-IDS detector records -> Elastic Common Schema (R-06, R-08).
#
# Filters only, so the same file runs in the stack (with 00-input.conf and 99-output.conf)
# and in the pipeline tests (with tests/harness/). An input marks its events with
# [@metadata][pipeline] = "mlids"; anything else passes through untouched.
#
# Two record types, one JSON object per line:
#   flow alert   (<capture>.alerts.jsonl, written by detector/src/live.py)
#   episode      (<capture>.episodes.jsonl, written by detector/episodes.py; has episode_id)
# The output index comes from [@metadata][index]: mlids-alert, mlids-episode, or mlids-error
# for a line that is not JSON or lacks a field the detection content relies on.

filter {
  if [@metadata][pipeline] == "mlids" {
    json {
      source => "message"
      target => "[@metadata][r]"
      tag_on_failure => ["_jsonparsefailure"]
    }

    if "_jsonparsefailure" in [tags] {
      mutate { add_field => { "[@metadata][index]" => "mlids-error" } }
    } else {
      mutate {
        # [host] would name the Logstash container, not anything in the alert.
        remove_field => ["message", "[event][original]", "[host]"]
        add_field => {
          "[event][kind]" => "alert"
          "[event][module]" => "mlids"
          "[observer][type]" => "ids"
          "[observer][product]" => "ML-IDS"
        }
        copy => { "[@metadata][r][src_ip]" => "[source][ip]" }
      }
      if ![labels][mode] {
        mutate { add_field => { "[labels][mode]" => "replay" } }
      }
      if [log][file][path] {
        grok {
          match => { "[log][file][path]" => "(?<[labels][capture]>[^/]+?)\.(alerts|episodes)\.jsonl$" }
          tag_on_failure => []
        }
      }

      if [@metadata][r][episode_id] {
        # ---- episode: one attacking source, its families and its time span (R-08)
        mutate {
          add_field => {
            "[event][dataset]" => "mlids.episode"
            "[@metadata][index]" => "mlids-episode"
          }
          copy => {
            "[@metadata][r][episode_id]" => "[mlids][episode][id]"
            "[@metadata][r][alerts]" => "[mlids][episode][alerts]"
            "[@metadata][r][families]" => "[mlids][episode][families]"
            "[@metadata][r][destinations]" => "[mlids][episode][destinations]"
            "[@metadata][r][dst_ports]" => "[mlids][episode][dst_ports]"
            "[@metadata][r][ports]" => "[mlids][episode][ports]"
            "[@metadata][r][duration_s]" => "[mlids][episode][duration_s]"
            "[@metadata][r][max_confidence]" => "[mlids][confidence]"
          }
        }
        mutate { copy => { "[mlids][episode][id]" => "[@metadata][doc_key]" } }
        date { match => ["[@metadata][r][first_flow_end]", "ISO8601"] target => "@timestamp" }
        date { match => ["[@metadata][r][first_flow_end]", "ISO8601"] target => "[event][start]" }
        date { match => ["[@metadata][r][last_flow_end]", "ISO8601"] target => "[event][end]" }
        ruby {
          code => '
            r = event.get("[@metadata][r]")
            fams = r["families"]
            event.set("[rule][name]", fams.keys) if fams.is_a?(Hash) && !fams.empty?
            dsts = r["dst_ips"].is_a?(Array) ? r["dst_ips"] : []
            event.set("[destination][ip]", dsts[0]) if dsts.length == 1
            event.set("[related][ip]", ([r["src_ip"]] + dsts).compact.uniq)
            d = r["duration_s"]
            event.set("[event][duration]", (d.to_f * 1_000_000_000).round) if d.is_a?(Numeric)
          '
        }
        if ![source][ip] or ![rule][name] {
          mutate { add_tag => ["_mlids_missing_fields"] }
        }
      } else {
        # ---- flow alert: one flow the model scored above the calibrated threshold
        mutate {
          add_field => {
            "[event][dataset]" => "mlids.alert"
            "[@metadata][index]" => "mlids-alert"
          }
          copy => {
            "[@metadata][r][src_port]" => "[source][port]"
            "[@metadata][r][dst_ip]" => "[destination][ip]"
            "[@metadata][r][dst_port]" => "[destination][port]"
            "[@metadata][r][prediction]" => "[rule][name]"
            "[@metadata][r][profile]" => "[rule][ruleset]"
            "[@metadata][r][confidence]" => "[mlids][confidence]"
            "[@metadata][r][extractor]" => "[mlids][extractor]"
          }
        }
        # @timestamp is when the flow ended (the attack's own time, replay or live);
        # event.created is when the detector scored it.
        date { match => ["[@metadata][r][flow_end]", "ISO8601"] target => "@timestamp" }
        date { match => ["[@metadata][r][time]", "ISO8601"] target => "[event][created]" }
        ruby {
          code => '
            r = event.get("[@metadata][r]")
            app = r["application"]
            event.set("[network][protocol]", app.downcase) if app.is_a?(String) && !app.empty? && app != "Unknown"
            event.set("[related][ip]", [r["src_ip"], r["dst_ip"]].compact.uniq)
            win = r.select { |k, v| k =~ /\AW\d+_/ && v.is_a?(Numeric) }
            event.set("[mlids][window]", win) unless win.empty?
            event.set("[@metadata][doc_key]",
                      [r["src_ip"], r["src_port"], r["dst_ip"], r["dst_port"], r["flow_end"], r["prediction"]].join("|"))
          '
        }
        # The fields the detection content and the MISP lookup (F6) read. A record without
        # them would be indexed and then never match anything, so it goes to mlids-error.
        if ![source][ip] or ![destination][ip] or ![destination][port] or ![rule][name] {
          mutate { add_tag => ["_mlids_missing_fields"] }
        }
      }

      if "_mlids_missing_fields" in [tags] {
        mutate { replace => { "[@metadata][index]" => "mlids-error" } }
      }
      # Stable document id: replaying the same capture again overwrites, never duplicates.
      fingerprint {
        source => ["[@metadata][doc_key]", "[labels][capture]"]
        concatenate_sources => true
        method => "SHA256"
        target => "[@metadata][doc_id]"
      }
    }
  }
}
