# Prometheus for the detection stack (R-06): scrapes the stack exporter, evaluates
# monitoring/alerts.yml and sends firing alerts to Alertmanager. Checked by promtool (make lint-ci).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mlids-exporter
    scrape_timeout: 10s     # the exporter's four requests take 2 s each at most
    static_configs:
      - targets: ["exporter:9108"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
