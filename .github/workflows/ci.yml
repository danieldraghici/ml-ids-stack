# Pull-request pipeline. Every job is a required check on main (ruleset main-checks); the
# table in docs/project.md maps each one to the risk it guards. The tools run as containers
# pinned by digest from ci/compose.yaml through the Makefile, the same commands as on the
# student's machine, instead of third-party actions (R-04).
name: ci
on:
  pull_request:
    branches: [main]

# Default token is read-only, and no job here widens it (R-03).
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Every third-party action is pinned to a full commit SHA, tag in the comment (R-04).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the whole history, not only the diff
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      # gitleaks runs below on the full history; no-commit-to-branch only makes sense locally.
      - run: SKIP=gitleaks,no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
      - name: gitleaks (full history, R-02)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose
      - name: ShellCheck, Hadolint, Semgrep, zizmor (R-04)
        run: make lint-ci

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q

  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy on both images and the Python dependencies, HIGH or CRITICAL fails (R-04)
        run: make scan

  detection-gate:
    name: detection-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.txt
      # The model ships outside git, as an asset of release model-v1. Its SHA-256 is checked
      # here against detector/thresholds.json and again by run.py before it is unpickled (R-07).
      - name: Model from release model-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download model-v1 --repo "$GITHUB_REPOSITORY" --dir models \
            --pattern "$(jq -r .model detector/thresholds.json)"
          make model-check
      - name: Replay the lab fixtures and compare with the baseline (R-06)
        run: make gate
