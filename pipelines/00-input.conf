# Stack input (R-06, R-09): the sensors' output folder, mounted read-only at /data.
# make replay writes <capture>.alerts.jsonl and <capture>.episodes.jsonl (ML-IDS), make suricata
# writes <capture>.eve.json; Logstash tails all three. Document ids are fingerprints (mlids.conf,
# suricata.conf), so re-reading a file after a restart overwrites instead of adding copies.
input {
  file {
    path => ["/data/*.alerts.jsonl", "/data/*.episodes.jsonl"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-mlids"
    mode => "tail"
    codec => plain
    add_field => { "[@metadata][pipeline]" => "mlids" }
  }
  file {
    path => ["/data/*.eve.json"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-suricata"
    mode => "tail"
    codec => plain
    add_field => { "[@metadata][pipeline]" => "suricata" }
  }
}
