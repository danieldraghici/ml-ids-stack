# Trust weight per publishing organisation for enrichment/misp_pull.py (R-10).
# A match's risk score is the base score for its priority times this weight, so a well-curated
# feed raises a record further than an unknown source. Changes go through a reviewed PR.
default_weight: 0.5
weights:
  CIRCL: 1.0                 # CIRCL OSINT Feed: curated analyst reports, mostly older than 30 days
  ADMIN: 0.8                 # the local MISP organisation: the CSV and freetext feeds (abuse.ch
                             # Feodo IP Blocklist, blocklist.de) and events created by hand
