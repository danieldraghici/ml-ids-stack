# MISP enrichment for every sensor (R-10). Runs after mlids.conf and suricata.conf (Logstash
# reads pipeline files in name order, and a test checks this file sorts last among the filters),
# so source.ip and destination.ip already exist.
#
# The dictionary is enrich/ioc_ip.yml, written by enrichment/misp_pull.py and reread every
# 300 s, so a new pull reaches the pipeline without a restart. Each value is a small JSON object:
# MISP event, category, publishing organisation, its trust weight, TLP and last update.
#
# Outcome rule:
#   a sensor alert (event.kind alert) whose source or destination is a MISP indicator
#       -> labels.priority high,   event.risk_score 90 x weight
#   any other record that touches an indicator (a flow, a DNS answer, an SSH session the
#   model and the rules did not alert on)
#       -> labels.priority medium, event.risk_score 60 x weight
#   no match -> the record is not touched at all: no threat field, no tag, no score.
# A match also writes threat.enrichments (ECS) and the short threat.indicator.matched reference.

filter {
  if [@metadata][pipeline] in ["mlids", "suricata"] and [@metadata][doc_id] {
    translate {
      source => "[source][ip]"
      target => "[@metadata][ti][source]"
      dictionary_path => "/enrich/ioc_ip.yml"
      refresh_interval => 300
    }
    translate {
      source => "[destination][ip]"
      target => "[@metadata][ti][destination]"
      dictionary_path => "/enrich/ioc_ip.yml"
      refresh_interval => 300
    }
    if [@metadata][ti] {
      ruby {
        code => '
          require "json"
          ti = event.get("[@metadata][ti]") || {}
          matches = []
          ["source", "destination"].each do |side|
            raw = ti[side]
            next if raw.nil?
            info = begin JSON.parse(raw.to_s) rescue { "event" => raw.to_s } end
            info["side"] = side
            info["ip"] = event.get("[" + side + "][ip]")
            matches << info
          end
          unless matches.empty?
            best = matches.max_by { |m| m["weight"].to_f }
            weight = [[best["weight"].to_f, 0.0].max, 1.0].min
            weight = 0.5 if best["weight"].nil?
            alert = event.get("[event][kind]") == "alert"
            event.set("[labels][priority]", alert ? "high" : "medium")
            event.set("[event][risk_score]", ((alert ? 90.0 : 60.0) * weight).round(1))
            event.set("[threat][indicator][matched]", "misp:" + best["event"].to_s + ":" + best["category"].to_s)
            event.set("[threat][enrichments]", matches.map { |m|
              { "indicator" => { "ip" => m["ip"], "type" => "ipv4-addr", "provider" => m["org"],
                                 "reference" => "misp:event:" + m["event"].to_s,
                                 "confidence" => m["weight"], "marking" => { "tlp" => m["tlp"].to_s.upcase },
                                 "modified_at" => m["updated"] },
                "matched" => { "atomic" => m["ip"], "field" => m["side"] + ".ip", "type" => "indicator_match_rule" } }
            })
            tags = event.get("tags") || []
            event.set("tags", (tags + ["threat_match"]).uniq)
          end
        '
      }
    }
  }
}
