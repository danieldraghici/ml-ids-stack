# F1 pipeline: the two required checks named in .github/rulesets/main-checks.json.
# F4 adds hadolint, semgrep, trivy, zizmor, the detection gate and the signed release.
name: ci
on:
  pull_request:
    branches: [main]

# Default token is read-only; a job widens only what it needs (R-03).
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Every third-party action is pinned to a full commit SHA, tag in the comment (R-04).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the whole history, not only the diff
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # gitleaks runs below on the full history; no-commit-to-branch only makes sense locally.
      - run: SKIP=gitleaks,no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
      - name: gitleaks (full history, R-02)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
