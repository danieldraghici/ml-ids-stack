# Suricata 8 EVE JSON -> Elastic Common Schema (R-06, R-09).
#
# Filters only, like mlids.conf: the stack input and the pipeline tests mark events with
# [@metadata][pipeline] = "suricata". Event types: alert, dns (EVE DNS version 3), ssh, flow.
# The rules in rules/sigma/ read the ECS names written here, so a change in this mapping is
# caught by the rule tests that run real EVE lines through it (tests/test_suricata_ecs.py).

filter {
  if [@metadata][pipeline] == "suricata" {
    json {
      source => "message"
      target => "[@metadata][e]"
      tag_on_failure => ["_jsonparsefailure"]
    }

    if "_jsonparsefailure" in [tags] {
      mutate { add_field => { "[@metadata][index]" => "suricata-error" } }
    } else {
      mutate {
        remove_field => ["message", "[event][original]", "[host]"]
        add_field => {
          "[event][module]" => "suricata"
          "[event][dataset]" => "suricata.%{[@metadata][e][event_type]}"
          "[observer][type]" => "ids"
          "[observer][product]" => "Suricata"
          "[@metadata][index]" => "suricata"
        }
        copy => {
          "[@metadata][e][src_ip]" => "[source][ip]"
          "[@metadata][e][src_port]" => "[source][port]"
          "[@metadata][e][dest_ip]" => "[destination][ip]"
          "[@metadata][e][dest_port]" => "[destination][port]"
          "[@metadata][e][flow_id]" => "[suricata][flow_id]"
          "[@metadata][e][app_proto]" => "[network][protocol]"
        }
      }
      if ![labels][mode] {
        mutate { add_field => { "[labels][mode]" => "replay" } }
      }
      if [log][file][path] {
        grok {
          match => { "[log][file][path]" => "(?<[labels][capture]>[^/]+?)\.eve\.json$" }
          tag_on_failure => []
        }
      }
      date { match => ["[@metadata][e][timestamp]", "ISO8601"] target => "@timestamp" }
      ruby {
        code => '
          e = event.get("[@metadata][e]")
          event.set("[network][transport]", e["proto"].to_s.downcase) if e["proto"]
          event.set("[related][ip]", [e["src_ip"], e["dest_ip"]].compact.uniq)
          event.set("[@metadata][doc_key]", [e["flow_id"], e["event_type"], e["timestamp"], e["pcap_cnt"],
                                             (e["alert"] || {})["signature_id"]].join("|"))
        '
      }

      if [@metadata][e][event_type] == "alert" {
        mutate {
          add_field => { "[event][kind]" => "alert" }
          copy => {
            "[@metadata][e][alert][signature_id]" => "[rule][id]"
            "[@metadata][e][alert][signature]" => "[rule][name]"
            "[@metadata][e][alert][category]" => "[rule][category]"
            "[@metadata][e][alert][severity]" => "[event][severity]"
          }
        }
        ruby {
          code => '
            md = (event.get("[@metadata][e][alert][metadata]") || {})
            ids = Array(md["mitre_technique_id"])
            event.set("[threat][technique][id]", ids) unless ids.empty?
            event.set("[threat][framework]", "MITRE ATT&CK") unless ids.empty?
          '
        }
      } else if [@metadata][e][event_type] == "dns" {
        mutate { add_field => { "[event][kind]" => "event" } }
        ruby {
          code => '
            d = event.get("[@metadata][e][dns]") || {}
            event.set("[dns][type]", d["type"] == "response" ? "answer" : "query")
            event.set("[dns][id]", d["id"]) if d["id"]
            event.set("[dns][response_code]", d["rcode"]) if d["rcode"]
            q = Array(d["queries"]).first
            if q
              event.set("[dns][question][name]", q["rrname"])
              event.set("[dns][question][type]", q["rrtype"])
            end
            answers = Array(d["answers"])
            unless answers.empty?
              event.set("[dns][answers]", answers.map { |a|
                { "name" => a["rrname"], "type" => a["rrtype"], "ttl" => a["ttl"], "data" => a["rdata"].to_s }
              })
            end
          '
        }
      } else if [@metadata][e][event_type] == "ssh" {
        mutate {
          add_field => { "[event][kind]" => "event" }
          copy => {
            "[@metadata][e][ssh][client][software_version]" => "[ssh][client][software_version]"
            "[@metadata][e][ssh][client][proto_version]" => "[ssh][client][proto_version]"
            "[@metadata][e][ssh][server][software_version]" => "[ssh][server][software_version]"
          }
        }
      } else if [@metadata][e][event_type] == "flow" {
        mutate {
          add_field => { "[event][kind]" => "event" "[event][category]" => "network" }
          copy => {
            "[@metadata][e][flow][pkts_toserver]" => "[source][packets]"
            "[@metadata][e][flow][pkts_toclient]" => "[destination][packets]"
            "[@metadata][e][flow][bytes_toserver]" => "[source][bytes]"
            "[@metadata][e][flow][bytes_toclient]" => "[destination][bytes]"
            "[@metadata][e][icmp_type]" => "[icmp][type]"
          }
        }
        date { match => ["[@metadata][e][flow][start]", "ISO8601"] target => "[event][start]" }
        date { match => ["[@metadata][e][flow][end]", "ISO8601"] target => "[event][end]" }
      }

      # Every EVE type the rules read has a source and a destination address.
      if ![source][ip] or ![destination][ip] {
        mutate { add_tag => ["_suricata_missing_fields"] replace => { "[@metadata][index]" => "suricata-error" } }
      }
      fingerprint {
        source => ["[@metadata][doc_key]", "[labels][capture]"]
        concatenate_sources => true
        method => "SHA256"
        target => "[@metadata][doc_id]"
      }
    }
  }
}
